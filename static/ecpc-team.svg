  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .c1 { opacity: 0; animation: cardIn 14s linear infinite; }
    .c2 { opacity: 0; animation: cardIn2 14s linear infinite; }
    .c3 { opacity: 0; animation: cardIn3 14s linear infinite; }
    .led { animation: pulseLed 1.6s ease-in-out infinite; }
    .avatar-bob { animation: bob 2.8s ease-in-out infinite; }

    @keyframes cardIn  { 0%, 8%  { opacity: 0; } 12%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes cardIn2 { 0%, 16% { opacity: 0; } 20%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes cardIn3 { 0%, 24% { opacity: 0; } 28%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes pulseLed { 0%, 100% { fill: #EF4444; } 50% { fill: #DCDCAA; } }
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
  </style>

  
