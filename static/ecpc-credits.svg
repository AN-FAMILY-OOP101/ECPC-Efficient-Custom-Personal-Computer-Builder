      <text y="150" class="ascii-yel" xml:space="preserve">    | |      BATSTATEU • CICS     | |</text>
      <text y="165" class="ascii-blu" xml:space="preserve">    | |       SECTION CS 2101     | |</text>
      <text y="180" class="ascii-dim" xml:space="preserve">     \ '-------------------------' /</text>
      <text y="195" class="ascii-dim" xml:space="preserve">      '----------=======----------'</text>
    </g>
    <g class="b4">
