  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .ascii-red { fill: #EF4444; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
    .ascii-dim { fill: #991B1B; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
    .ascii-yel { fill: #DCDCAA; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
    .ascii-blu { fill: #9CDCFE; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }

    .badge-float { animation: floatBadge 3.8s ease-in-out infinite; }
    .blink { animation: blink 0.9s step-end infinite; }

    /* Pixel Letters: Backspace S -&gt; T -&gt; I -&gt; D -&gt; E -&gt; R -&gt; C | Type C -&gt; R -&gt; E -&gt; D -&gt; I -&gt; T -&gt; S */
    .p1 { animation: seqP1 25s linear infinite; }
    .p2 { animation: seqP2 25s linear infinite; }
    .p3 { animation: seqP3 25s linear infinite; }
    .p4 { animation: seqP4 25s linear infinite; }
    .p5 { animation: seqP5 25s linear infinite; }
    .p6 { animation: seqP6 25s linear infinite; }
    .p7 { animation: seqP7 25s linear infinite; }

    /* ASCII Plaque: Backspace Bottom-to-Top | Build Top-to-Bottom */
    .b1 { animation: seqB1 25s linear infinite; }
    .b2 { animation: seqB2 25s linear infinite; }
    .b3 { animation: seqB3 25s linear infinite; }
    .b4 { animation: seqB4 25s linear infinite; }

    /* Dedication Box Frame */
    .box-in { animation: seqBox 25s linear infinite; }

    @keyframes seqBox {
      0%, 11.8%   { opacity: 1; }
      12.3%, 64.5%{ opacity: 0; }
      65.0%, 100% { opacity: 1; }
    }

    @keyframes seqP7 { 0%, 27.0% { opacity: 1; } 27.5%, 49.4% { opacity: 0; } 49.8%, 100% { opacity: 1; } }
    @keyframes seqP6 { 0%, 27.6% { opacity: 1; } 28.1%, 48.8% { opacity: 0; } 49.2%, 100% { opacity: 1; } }
    @keyframes seqP5 { 0%, 28.2% { opacity: 1; } 28.7%, 48.2% { opacity: 0; } 48.6%, 100% { opacity: 1; } }
    @keyframes seqP4 { 0%, 28.8% { opacity: 1; } 29.3%, 47.6% { opacity: 0; } 48.0%, 100% { opacity: 1; } }
    @keyframes seqP3 { 0%, 29.4% { opacity: 1; } 29.9%, 47.0% { opacity: 0; } 47.4%, 100% { opacity: 1; } }
    @keyframes seqP2 { 0%, 30.0% { opacity: 1; } 30.5%, 46.4% { opacity: 0; } 46.8%, 100% { opacity: 1; } }
    @keyframes seqP1 { 0%, 30.6% { opacity: 1; } 31.1%, 45.8% { opacity: 0; } 46.2%, 100% { opacity: 1; } }

    @keyframes seqB4 { 0%, 27.2% { opacity: 1; } 27.8%, 45.0% { opacity: 0; } 45.5%, 100% { opacity: 1; } }
    @keyframes seqB3 { 0%, 28.4% { opacity: 1; } 29.0%, 44.0% { opacity: 0; } 44.5%, 100% { opacity: 1; } }
    @keyframes seqB2 { 0%, 29.6% { opacity: 1; } 30.2%, 43.0% { opacity: 0; } 43.5%, 100% { opacity: 1; } }
    @keyframes seqB1 { 0%, 30.8% { opacity: 1; } 31.4%, 42.0% { opacity: 0; } 42.5%, 100% { opacity: 1; } }

    @keyframes floatBadge {
      0%, 100% { transform: translate(28px, 64px); }
      50%      { transform: translate(28px, 56px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  
  <rect x="1" y="1" width="918" height="388" rx="10" fill="#0B0C10" stroke="#991B1B" stroke-width="2" />

  
  <rect x="2" y="2" width="916" height="32" rx="8" fill="#16181D" />
