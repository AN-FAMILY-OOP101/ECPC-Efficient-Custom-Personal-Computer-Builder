<svg width="920" height="380" viewBox="0 0 920 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    

    <clipPath id="clip-header">
      <rect x="275" y="4" width="370" height="28">
        <animate attributeName="width" values="370; 370; 0; 0; 370; 370" keyTimes="0; 0.225; 0.273; 0.364; 0.424; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip-sub">
      <rect x="0" y="38" width="470" height="26">
        <animate attributeName="width" values="470; 470; 0; 0; 470; 470" keyTimes="0; 0.165; 0.205; 0.460; 0.520; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip-ok1">
      <rect x="0" y="80" width="475" height="24">
        <animate attributeName="width" values="475; 475; 0; 0; 475; 475" keyTimes="0; 0.130; 0.165; 0.520; 0.568; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip-ok2">
      <rect x="0" y="104" width="475" height="24">
        <animate attributeName="width" values="475; 475; 0; 0; 475; 475" keyTimes="0; 0.095; 0.130; 0.568; 0.615; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip-ok3">
      <rect x="0" y="128" width="475" height="24">
        <animate attributeName="width" values="475; 475; 0; 0; 475; 475" keyTimes="0; 0.065; 0.095; 0.615; 0.660; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <clipPath id="clip-tag">
      <rect x="20" y="182" width="430" height="36">
        <animate attributeName="width" values="430; 430; 0; 0; 430; 430" keyTimes="0; 0.030; 0.065; 0.665; 0.697; 1" dur="16.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .ascii-red { fill: #EF4444; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
    .ascii-dim { fill: #991B1B; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
    .ascii-yel { fill: #DCDCAA; font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; white-space: pre; }

    /* Synchronized 16.5s Cycle */
    .r1     { animation: seqR1   16.5s linear infinite; }
    .r2     { animation: seqR2   16.5s linear infinite; }
    .r3     { animation: seqR3   16.5s linear infinite; }
    .r4     { animation: seqR4   16.5s linear infinite; }
    .r5     { animation: seqR5   16.5s linear infinite; }
    .pE     { animation: seqPE   16.5s linear infinite; }
    .pC1    { animation: seqPC1  16.5s linear infinite; }
    .pP     { animation: seqPP   16.5s linear infinite; }
    .pC2    { animation: seqPC2  16.5s linear infinite; }
    .box-in { animation: seqBox  16.5s linear infinite; }

    .rig-float { animation: floatRig 3.6s ease-in-out infinite; }
    .pwr-pulse { animation: pwrGlow 1.5s ease-in-out infinite; }
    .blink     { animation: blink 0.9s step-end infinite; }

    /* Tagline Box */
    @keyframes seqBox {
      0%, 6.3%    { opacity: 1; }
      6.8%, 66.0% { opacity: 0; }
      66.5%, 100% { opacity: 1; }
    }

    /* Pixel Letters: Backspace C2 -&gt; P -&gt; C1 -&gt; E | Type E -&gt; C1 -&gt; P -&gt; C2 */
    @keyframes seqPC2 {
      0%, 20.5%    { opacity: 1; }
      21.0%, 45.2% { opacity: 0; }
      45.8%, 100%  { opacity: 1; }
    }
    @keyframes seqPP {
      0%, 21.3%    { opacity: 1; }
      21.8%, 44.3% { opacity: 0; }
      44.9%, 100%  { opacity: 1; }
    }
    @keyframes seqPC1 {
      0%, 22.1%    { opacity: 1; }
      22.6%, 43.4% { opacity: 0; }
      44.0%, 100%  { opacity: 1; }
    }
    @keyframes seqPE {
      0%, 22.9%    { opacity: 1; }
      23.4%, 42.4% { opacity: 0; }
      43.0%, 100%  { opacity: 1; }
    }

    /* ASCII PC Rig: Backspace Bottom-to-Top | Build Top-to-Bottom */
    @keyframes seqR5 {
      0%, 21.0%    { opacity: 1; }
      21.6%, 42.4% { opacity: 0; }
      43.1%, 100%  { opacity: 1; }
    }
    @keyframes seqR4 {
      0%, 22.2%    { opacity: 1; }
      22.8%, 40.9% { opacity: 0; }
      41.6%, 100%  { opacity: 1; }
    }
    @keyframes seqR3 {
      0%, 23.4%    { opacity: 1; }
      24.0%, 39.4% { opacity: 0; }
      40.1%, 100%  { opacity: 1; }
    }
    @keyframes seqR2 {
      0%, 24.6%    { opacity: 1; }
      25.2%, 37.9% { opacity: 0; }
      38.6%, 100%  { opacity: 1; }
    }
    @keyframes seqR1 {
      0%, 25.8%    { opacity: 1; }
      26.4%, 36.4% { opacity: 0; }
      37.1%, 100%  { opacity: 1; }
    }

    @keyframes floatRig {
      0%, 100% { transform: translate(22px, 62px); }
      50%      { transform: translate(22px, 54px); }
    }
    @keyframes pwrGlow {
      0%, 100% { fill: #EF4444; }
      50%      { fill: #DCDCAA; }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  
  <rect x="1" y="1" width="918" height="378" rx="10" fill="#0B0C10" stroke="#991B1B" stroke-width="2" />
  
  
  <rect x="2" y="2" width="916" height="32" rx="8" fill="#16181D" />
  <circle cx="22" cy="18" r="5" fill="#EF4444" />
  <circle cx="40" cy="18" r="5" fill="#DCDCAA" />
  <circle cx="58" cy="18" r="5" fill="#9CDCFE" />
  <g clip-path="url(#clip-header)">
    <text x="460" y="23" text-anchor="middle" fill="#9CDCFE" class="mono" font-size="12" font-weight="700">ECPC-BIOS v1.0.0 — AN FAMILY (CS 2101)</text>
  </g>

  
  <g class="rig-float" transform="translate(22, 62)">
    <g class="r1">
      <text y="0" class="ascii-dim" xml:space="preserve">      .-------------------------.        .-----------.</text>
      <text y="15" class="ascii-dim" xml:space="preserve">     / .-----------------------. \      / .---------. \</text>
      <text y="30" class="ascii-red" xml:space="preserve">    | |                         | |    | |  [=====]  | |</text>
    </g>
    <g class="r2">
      <text y="45" class="ascii-red" xml:space="preserve">    | |     ███████╗ ██████╗    | |    | |  <tspan class="pwr-pulse">(o) PWR</tspan>  | |</text>
      <text y="60" class="ascii-yel" xml:space="preserve">    | |     ██╔════╝██╔════╝    | |    | |  -------  | |</text>
      <text y="75" class="ascii-yel" xml:space="preserve">    | |     █████╗  ██║         | |    | |  | GPU |  | |</text>
    </g>
    <g class="r3">
      <text y="90" class="ascii-red" xml:space="preserve">    | |     ██╔══╝  ██║         | |    | |  | FAN |  | |</text>
      <text y="105" class="ascii-red" xml:space="preserve">    | |     ███████╗╚██████╗    | |    | |  -------  | |</text>
      <text y="120" class="ascii-red" xml:space="preserve">    | |     ╚══════╝ ╚═════╝    | |    | |  [:::::]  | |</text>
    </g>
    <g class="r4">
      <text y="135" class="ascii-dim" xml:space="preserve">    | |                         | |    | |  [:::::]  | |</text>
      <text y="150" class="ascii-dim" xml:space="preserve">     \ '-----------------------' /      | |  [:::::]  | |</text>
      <text y="165" class="ascii-dim" xml:space="preserve">      '---------=======---------'       | |           | |</text>
      <text y="180" class="ascii-red" xml:space="preserve">               _[=====]_                | '---------' |</text>
      <text y="195" class="ascii-red" xml:space="preserve">            .-'---------'-.             '-------------'</text>
    </g>
    <g class="r5">
      <text y="220" class="ascii-dim" xml:space="preserve">       .-----------------------.</text>
      <text y="235" class="ascii-red" xml:space="preserve">      / [][][][][][][][][][][] /   .---.</text>
      <text y="250" class="ascii-red" xml:space="preserve">     / [][][][][][][][][][][] /   /  |  \</text>
      <text y="265" class="ascii-dim" xml:space="preserve">    '-----------------------'    '-----'</text>
    </g>
  </g>

  
  <g transform="translate(420, 56)">
    
    <g class="pE" fill="#EF4444" transform="translate(0, 0)">
      <rect x="0" y="0" width="35" height="7" />
      <rect x="0" y="7" width="7" height="7" />
      <rect x="0" y="14" width="28" height="7" />
      <rect x="0" y="21" width="7" height="7" />
      <rect x="0" y="28" width="35" height="7" />
    </g>
    <g class="pC1" fill="#EF4444" transform="translate(46, 0)">
      <rect x="7" y="0" width="21" height="7" />
      <rect x="0" y="7" width="7" height="21" />
      <rect x="28" y="7" width="7" height="4" />
      <rect x="28" y="24" width="7" height="4" />
      <rect x="7" y="28" width="21" height="7" />
    </g>
    <g class="pP" fill="#EF4444" transform="translate(92, 0)">
      <rect x="0" y="0" width="28" height="7" />
      <rect x="0" y="7" width="7" height="28" />
      <rect x="28" y="7" width="7" height="7" />
      <rect x="7" y="14" width="21" height="7" />
    </g>
    <g class="pC2" fill="#EF4444" transform="translate(138, 0)">
      <rect x="7" y="0" width="21" height="7" />
      <rect x="0" y="7" width="7" height="21" />
      <rect x="28" y="7" width="7" height="4" />
      <rect x="28" y="24" width="7" height="4" />
      <rect x="7" y="28" width="21" height="7" />
    </g>

    
    <g clip-path="url(#clip-sub)">
      <text x="0" y="56" fill="#F8FAFC" class="mono" font-size="15.5" font-weight="700">Efficient Custom Personal Computer Builder</text>
    </g>
    <line x1="0" y1="70" x2="470" y2="70" stroke="#30363D" stroke-width="1" />

    
    <g clip-path="url(#clip-ok1)">
      <text x="0" y="98" fill="#9CDCFE" class="mono" font-size="12.5">[OK] Loading PartCatalog (Components.json) ....... 100%</text>
    </g>
    <g clip-path="url(#clip-ok2)">
      <text x="0" y="122" fill="#9CDCFE" class="mono" font-size="12.5">[OK] Initializing CompatibilityChecker ........... READY</text>
    </g>
    <g clip-path="url(#clip-ok3)">
      <text x="0" y="146" fill="#9CDCFE" class="mono" font-size="12.5">[OK] Calibrating BottleneckAnalyzer .............. ONLINE</text>
    </g>

    
    <g class="box-in">
      <rect x="0" y="174" width="470" height="54" rx="6" fill="#141112" stroke="#EF4444" stroke-width="1.5" />
    </g>
    <g clip-path="url(#clip-tag)">
      <text x="235" y="207" text-anchor="middle" fill="#DCDCAA" class="mono" font-size="16" font-weight="800" letter-spacing="1.5">
        &gt;&gt; BUILD RIGHT THE FIRST TIME. &lt;&lt;<tspan fill="#EF4444" class="blink"> ▋</tspan>
      </text>
    </g>
  </g>
</svg>